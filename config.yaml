# Single source of truth for the pipeline. Everything reads this via src/common/config.py.

tickers:
  NVDA: {cik: "0001045810", company: "NVIDIA Corporation"}
  MSFT: {cik: "0000789019", company: "Microsoft Corporation"}
  JPM:  {cik: "0000019617", company: "JPMorgan Chase & Co."}
  # Phase-2 additions if time remains:
  # AMZN: {cik: "0001018724", company: "Amazon.com Inc."}
  # META: {cik: "0001326801", company: "Meta Platforms Inc."}

edgar:
  user_agent: "example@example.com"   # SEC requires real contact
  max_rps: 8
  forms: ["10-K", "10-Q", "8-K"]
  n_10q: 4
  n_8k: 8            # cap on recent earnings-related 8-Ks (Item 2.02) per ticker

storage:
  mode: "docker"
  sqlite_path: "data/finrag.db"
  qdrant_path: "data/qdrant_local"
  
postgres:
  dsn: "postgresql://finrag:finrag@localhost:5433/finrag"

qdrant:
  url: "http://localhost:6333"
  collection: "filings"
  hnsw_m: 16
  hnsw_ef_construct: 100

embedding:
  model: "BAAI/bge-small-en-v1.5"
  dim: 384
  batch_size: 64
  query_prefix: "Represent this sentence for searching relevant passages: "  # bge convention

chunking:
  target_tokens: 480
  overlap_tokens: 80

retrieval:
  bm25_path: "data/bm25.pkl"
  dense_top_k: 30
  sparse_top_k: 30
  rrf_k: 60
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  final_top_k: 6

generation:
  backend: "ollama"          # ollama | anthropic
  ollama_model: "llama3.1:8b"
  ollama_url: "http://localhost:11434"
  temperature: 0.1
  validation:                # post-generation chain; fail closed to INSUFFICIENT EVIDENCE
    enabled: true
    min_citation_coverage: 0.8   # share of claim sentences that must carry a [n]
    min_grounding_overlap: 0.5   # share of a sentence's content words found in its cited item

news:
  lookback_days: 7
  dedup_headline_sim: 0.90      # cosine over headline embeddings -> near-duplicate
  event_cluster_threshold: 0.75 # cosine -> same event (agglomerative, average linkage)
  max_per_feed: 60
  fetch_text: true              # trafilatura body fetch for direct publisher URLs
  fetch_timeout: 20

  # Google News gives broad coverage but opaque redirect URLs (headline-only).
  # Yahoo gives direct publisher URLs (body extractable) but leaks unrelated
  # syndicated finance content, so headlines are alias-filtered. See DECISIONS #21.
  feeds:
    google_news: "https://news.google.com/rss/search?q={query}+when:{days}d&hl=en-US&gl=US&ceid=US:en"
    yahoo: "https://feeds.finance.yahoo.com/rss/2.0/headline?s={ticker}&region=US&lang=en-US"

  # First-party newsrooms: authoritative, direct URLs, body always extractable.
  # Each was picked on *freshness*, not just HTTP 200 — two of the obvious URLs
  # return a valid feed that is over a year stale. See DECISIONS #21.
  #   MSFT: news.microsoft.com/feed/ parses fine but its newest item is 2025-05-07,
  #         so it contributes nothing in a 7-day window; /source/feed/ is the live one.
  #   JPM:  jpmorganchase.com/news-stories/rss -> 404; the IR host carries the real feed.
  ir_feeds:
    NVDA: "https://nvidianews.nvidia.com/releases.xml"
    MSFT: "https://news.microsoft.com/source/feed/"
    JPM:  "https://jpmorganchaseco.gcs-web.com/rss/news-releases.xml"

  queries:
    NVDA: "NVIDIA NVDA stock"
    MSFT: "Microsoft MSFT stock"
    JPM: "JPMorgan Chase JPM stock"

  # Relevance filter for feeds that aren't strictly ticker-scoped.
  aliases:
    NVDA: ["nvidia", "nvda"]
    MSFT: ["microsoft", "msft"]
    JPM: ["jpmorgan", "jp morgan", "jpmorgan chase", "jpm"]

  # Rule-based topic tags, first match wins. Keeps the brief groupable without an LLM.
  topics:
    earnings: ["earnings", "quarterly results", "beats", "misses", "revenue", "eps", "guidance"]
    product: ["launch", "unveil", "announce", "release", "chip", "gpu", "model", "platform"]
    regulatory: ["sec ", "antitrust", "regulator", "probe", "investigation", "lawsuit", "fine"]
    analyst: ["price target", "upgrade", "downgrade", "analyst", "rating", "prediction", "forecast", "valuation"]
    deal: ["acquisition", "acquire", "merger", "partnership", "stake in", "buyout", "joint venture"]
    macro: ["tariff", "export", "china", "fed", "rates", "inflation"]
