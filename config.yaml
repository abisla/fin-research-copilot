# Single source of truth for the pipeline. Everything reads this via src/common/config.py.

tickers:
  NVDA: {cik: "0001045810", company: "NVIDIA Corporation"}
  MSFT: {cik: "0000789019", company: "Microsoft Corporation"}
  JPM:  {cik: "0000019617", company: "JPMorgan Chase & Co."}
  # Phase-2 additions if time remains:
  # AMZN: {cik: "0001018724", company: "Amazon.com Inc."}
  # META: {cik: "0001326801", company: "Meta Platforms Inc."}

edgar:
  user_agent: "bisla.amaritpal@email.com"   # SEC requires real contact
  max_rps: 8
  forms: ["10-K", "10-Q", "8-K"]
  n_10q: 4

postgres:
  dsn: "postgresql://finrag:finrag@localhost:5433/finrag"

qdrant:
  url: "http://localhost:6333"
  collection: "filings"

embedding:
  model: "BAAI/bge-small-en-v1.5"
  dim: 384
  query_prefix: "Represent this sentence for searching relevant passages: "  # bge convention

chunking:
  target_tokens: 750
  overlap_tokens: 100

retrieval:
  dense_top_k: 30
  sparse_top_k: 30
  rrf_k: 60
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  final_top_k: 6

generation:
  backend: "ollama"          # ollama | anthropic
  ollama_model: "llama3.1:8b"
  ollama_url: "http://localhost:11434"
  temperature: 0.1

news:
  lookback_days: 7
  dedup_headline_sim: 0.90
  event_cluster_threshold: 0.75
