services:
  postgres:
    image: postgres:16-alpine
    container_name: finrag-postgres
    environment:
      POSTGRES_USER: finrag
      POSTGRES_PASSWORD: finrag
      POSTGRES_DB: finrag
    ports:
      - "5433:5432"   # 5433 to avoid clashing with any local postgres (Hermes stack)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: finrag-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  qdrant_data:
