[project]
name = "fin-research-copilot"
version = "0.1.0"
description = "Financial Research Copilot — hybrid RAG over SEC filings, structured financials, and news"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "psycopg[binary]>=3.1",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "trafilatura>=1.8",          # article text extraction
    "feedparser>=6.0",           # RSS ingestion
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "streamlit>=1.35",
    "scikit-learn>=1.4",         # agglomerative clustering for news events
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
